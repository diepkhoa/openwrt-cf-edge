# Example configuration for cf-edge (/etc/cf-edge/config.yaml)
# This file is read-only at runtime; dynamic state is stored in /tmp/cf-edge-state.json.

node_name: "x96air" # Defaults to os.Hostname() if omitted

wan:
  iface_v4: "wan"
  iface_v6: "wan6"       # Leave empty if node does not use a separate IPv6 interface
  overlay_iface: "wt0"   # NetBird/WireGuard overlay interface (used by DDoS detector)
  lan_iface: ""          # Optional: e.g. "br-lan" to subtract TX_LAN from Junk_Mbps

cloudflare:
  zone_id: "your-zone-id"
  api_token: "your-dns-edit-token" # Scoped to Zone:DNS:Edit only
  records:
    - subdomain: "wg-x96air.example.com"
      ipv4: true
      ipv6: true
      proxied: false # Set true if Cloudflare Orange Cloud proxy is enabled (skips reconcile)

reconcile:
  enabled: true
  interval: "10m"
  resolvers:
    - "1.1.1.1:53"
    - "8.8.8.8:53"
    - "1.0.0.1:53"

# Optional: Enable on PPPoE routers prone to netifd AUTH_FAILED lockout
pppoe_guard:
  enabled: false
  boot_grace: "90s"
  initial_wait: "45s"
  ping_targets:
    - "1.1.1.1"
    - "8.8.8.8"
    - "203.162.4.190"

# Optional: Enable on Edge Router cooperating with a Cloudflare Maintenance Worker
ddos_shield:
  enabled: false
  worker_url: "https://maintenance.example.com"
  worker_token: "your-worker-bearer-token"
  wan_ingress_port: 443
  check_interval: "5s"
  sustain_duration: "25s"
  conntrack_threshold: 5000
  junk_mbps_threshold: 300
  rx_pps_threshold: 80000
  max_redials_per_hour: 3
  status_poll_interval: "2m"

# Optional: OpenWrt 25.12 fw4-native GeoIP + rate-limit firewall (table inet cf_edge_fw)
edge_firewall:
  enabled: false
  refresh_interval: "168h"                   # Refresh GeoIP/Cloudflare ranges weekly
  cache_path: "/etc/cf-edge/geoip-cache.json"
  wan_devices: []                            # Optional override; empty = auto-resolve via ubus
  geoip_countries: ["vn"]
  include_cloudflare: true
  allow_cidrs: []
  drop_invalid_tcp: true
  drop_ip_options_tcp: false
  allow_ssh_port: false
  rollback_on_check_fail: true
  health_check_tcp: ["1.1.1.1:443", "8.8.8.8:443"]
  health_check_udp: ["1.1.1.1:53", "8.8.8.8:53"]
  health_check_internal_tcp: []              # Optional LAN/NetBird peer checks, e.g. ["192.168.1.10:22"]
  rules:
    - name: "haproxy_https"
      chain: "input"
      proto: "tcp"
      ports: [443]
      geoip_enforce: true
      global_pps: 30000
      global_burst: 5000
      per_ip_pps: 26000
      per_ip_burst: 5000
      max_conns_per_ip: 80
      syn_rate_per_ip: 25
      syn_burst: 100
    - name: "livekit_webrtc"
      chain: "forward"
      proto: "udp"
      ports: [50044]
      geoip_enforce: true
      global_pps: 15000
      global_burst: 2000
      per_ip_pps: 5000
      per_ip_burst: 800

# Optional: Check GitHub Releases once per day at a custom local time (24h "HH:MM")
auto_update:
  enabled: false
  time: "03:30"
  restart: true

telegram:
  enabled: false
  bot_token: "your-bot-token"
  chat_id: "your-chat-id"
